name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag"
        required: true
        default: "v0.0.11"

permissions:
  contents: write

env:
  PLUGIN_NAME: model-retry-wrapper

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test .

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
            ext: dll
          - os: ubuntu-latest
            target: linux-amd64
            ext: so
          - os: macos-latest
            target: darwin-arm64
            ext: dylib

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build plugin
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: |
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          $version = "${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          $pluginVersion = $version.TrimStart("v")
          go build -buildmode=c-shared -ldflags "-X main.pluginVersion=$pluginVersion" -o "dist/${{ env.PLUGIN_NAME }}.${{ matrix.ext }}" .

      - name: Package plugin
        shell: pwsh
        run: |
          $files = @("dist/${{ env.PLUGIN_NAME }}.${{ matrix.ext }}")
          $header = "dist/${{ env.PLUGIN_NAME }}.h"
          if (Test-Path -LiteralPath $header) {
            $files += $header
          }
          Compress-Archive -Path $files -DestinationPath "dist/${{ env.PLUGIN_NAME }}-${{ matrix.target }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.target }}
          path: dist/${{ env.PLUGIN_NAME }}-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Validate version
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if ("${{ inputs.version }}" -notmatch '^v\d+\.\d+\.\d+([\-+][0-9A-Za-z.-]+)?$') {
            throw "Version must look like vMAJOR.MINOR.PATCH"
          }

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*.zip
          generate_release_notes: true
